x-repo:
  &services-repo
  type: bind
  source: "/Users/guy/Code/c3s-attribution"
  target: /code

x-storage:
  &services-storage
  type: bind
  source: "/Users/guy/Data/c3s-attribution/"
  target: /data


services:

  c3spy:
    image: c3spy
    platform: "linux/amd64"
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - CUSTOM_ENV=pyenv.yml
    stdin_open: true
    tty: true
    volumes:
    - *services-repo
    - *services-storage
    command: bash
