<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Color Scale Demo</title>
		<script src="https://d3js.org/d3.v7.min.js"></script>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
			}
			.section {
				height: 20%;
				width: 100%;
				display: flex;
			}
			.gradient {
				flex: 1;
			}
		</style>
	</head>
	<body>
		<div id="div1" class="section"></div>
		<div id="div2" class="section"></div>
		<div id="div3" class="section"></div>
		<div id="div4" class="section"></div>
		<div id="div5" class="section"></div>

		<script>
			const steps = 10 // t from 0 to 1 in 0.1 steps

			// Your original HSL function
			function interpolateHSL(baseColor = 'rgb(151, 24, 65)') {
				const hcl = d3.hcl(baseColor)
				const { h, c } = hcl
				const deltaL = 90
				const L1 = 5

				// smooth chroma taper: fully saturated at mid L, drops near extremes
				const safeChroma = (L) => {
					const t = Math.abs((L - 50) / 50) // 0 at mid, 1 at extremes
					return c * (1 - t ** 1.2) // tweak exponent for smoothness
				}

				return (t) => {
					const L = L1 + deltaL * (1 - t) // flip t to go light -> dark
					const adjustedC = safeChroma(L)
					return d3.hcl(h, adjustedC, L).formatRgb()
				}
			}

			// My HCL version
			function interpolateHCL(baseColor = 'rgb(151, 24, 65)') {
				const hcl = d3.hcl(baseColor)
				const L0 = 98
				const L1 = 2
				return (t) => d3.hcl(hcl.h, hcl.c, L0 * (1 - t) + L1 * t).formatRgb()
			}

			// Midpoint = base colour version
			function interpolateHCLMid(baseColor = 'rgb(151, 24, 65)') {
				const hcl = d3.hcl(baseColor)
				const L0 = 90
				const L1 = 20
				const Lmid = hcl.l
				return (t) => {
					const L =
						t < 0.5
							? L0 * (1 - 2 * t) + Lmid * 2 * t
							: Lmid * (2 - 2 * t) + L1 * (2 * t - 1)
					return d3.hcl(hcl.h, hcl.c, L).formatRgb()
				}
			}
			function interpolateColorRev(baseColor = 'rgb(151, 24, 65)') {
				const hcl = d3.hcl(baseColor)
				return (t) => {
					const C = t * 50 // a wee bit punchier
					const L = 20 + t * 70 // deeper lows, brighter highs
					return d3.hcl(hcl.h, C, L).formatRgb()
				}
			}

			function interpolateColorRev1(baseColor = 'rgb(151, 24, 65)') {
				const hcl = d3.hcl(baseColor)
				return (t) => {
					const C = t * 50 // a wee bit punchier
					const L = 20 + t * 70 // deeper lows, brighter highs
					return d3.hcl(hcl.h, C, L).formatRgb()
				}
			}
			function interpolateColorRev2(baseColor = 'rgb(151, 24, 65)') {
				const hcl = d3.hcl(baseColor)
				return (t) => {
					const C = Math.pow(t, 2) * 50 // very strong saturation swing
					const L = 20 + t * 70 // smaller lightness spread, keeps mids strong
					return d3.hcl(hcl.h, C, L).formatRgb()
				}
			}
			function interpolateColorRev3(baseColor = 'rgb(151, 24, 65)') {
				const hcl = d3.hcl(baseColor)
				return (t) => {
					const C = t * 60 // ramp saturation nonlinearly
					const L = 30 + t * 50
					return d3.hcl(hcl.h, C, L).formatRgb()
				}
			}
			function interpolateColorRev4(baseColor = 'rgb(151, 24, 65)') {
				const hcl = d3.hcl(baseColor)
				return (t) => {
					const C = 10 + t * 55 // start slightly coloured even at t=0
					const L = 95 - t * 65 // from near-white tae deep tone
					return d3.hcl(hcl.h, C, L).formatRgb()
				}
			}

			// Helper to create CSS gradient
			function makeGradient(fn) {
				const stops = []
				for (let i = 0; i <= steps; i++) {
					const t = i / steps
					stops.push(`${fn(t)} ${t * 100}%`)
				}
				return `linear-gradient(to right, ${stops.join(', ')})`
			}

			// Apply gradients
			document.getElementById('div1').style.background = makeGradient(
				interpolateColorRev('rgb(44,102,162)'),
			)
			document.getElementById('div2').style.background = makeGradient(
				interpolateColorRev1('rgb(44,102,162)'),
			)
			document.getElementById('div3').style.background = makeGradient(
				interpolateColorRev2('rgb(44,102,162)'),
			)
			document.getElementById('div4').style.background = makeGradient(
				interpolateColorRev3('rgb(44,102,162)'),
			)
			document.getElementById('div5').style.background = makeGradient(
				interpolateColorRev4('rgb(44,102,162)'),
			)
		</script>
	</body>
</html>
