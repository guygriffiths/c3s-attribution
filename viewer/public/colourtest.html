<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Color Scale Demo</title>
		<script src="https://d3js.org/d3.v7.min.js"></script>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
			}
			.section {
				height: 33.33%;
				width: 100%;
				display: flex;
			}
			.gradient {
				flex: 1;
			}
		</style>
	</head>
	<body>
		<div id="div1" class="section"></div>
		<div id="div2" class="section"></div>
		<div id="div3" class="section"></div>

		<script>
			const steps = 10 // t from 0 to 1 in 0.1 steps

			// Your original HSL function
			function interpolateHSL(baseColor = 'rgb(151, 24, 65)') {
				const hcl = d3.hcl(baseColor)
				const { h, c } = hcl
				const deltaL = 90
				const L1 = 5

				// smooth chroma taper: fully saturated at mid L, drops near extremes
				const safeChroma = (L) => {
					const t = Math.abs((L - 50) / 50) // 0 at mid, 1 at extremes
					return c * (1 - t ** 1.2) // tweak exponent for smoothness
				}

				return (t) => {
					const L = L1 + deltaL * (1 - t) // flip t to go light -> dark
					const adjustedC = safeChroma(L)
					return d3.hcl(h, adjustedC, L).formatRgb()
				}
			}

			// My HCL version
			function interpolateHCL(baseColor = 'rgb(151, 24, 65)') {
				const hcl = d3.hcl(baseColor)
				const L0 = 98
				const L1 = 2
				return (t) => d3.hcl(hcl.h, hcl.c, L0 * (1 - t) + L1 * t).formatRgb()
			}

			// Midpoint = base colour version
			function interpolateHCLMid(baseColor = 'rgb(151, 24, 65)') {
				const hcl = d3.hcl(baseColor)
				const L0 = 90
				const L1 = 20
				const Lmid = hcl.l
				return (t) => {
					const L =
						t < 0.5
							? L0 * (1 - 2 * t) + Lmid * 2 * t
							: Lmid * (2 - 2 * t) + L1 * (2 * t - 1)
					return d3.hcl(hcl.h, hcl.c, L).formatRgb()
				}
			}

			// Helper to create CSS gradient
			function makeGradient(fn) {
				const stops = []
				for (let i = 0; i <= steps; i++) {
					const t = i / steps
					stops.push(`${fn(t)} ${t * 100}%`)
				}
				return `linear-gradient(to right, ${stops.join(', ')})`
			}

			// Apply gradients
			document.getElementById('div1').style.background =
				makeGradient(interpolateHSL())
			document.getElementById('div2').style.background =
				makeGradient(interpolateHCL())
			document.getElementById('div3').style.background =
				makeGradient(interpolateHCLMid())
		</script>
	</body>
</html>
