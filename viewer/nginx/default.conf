server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic auth across the whole server block, so it also covers /assets/
    auth_basic "C3S Extreme Events";
    auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are safe to cache indefinitely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history-mode routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients pin an old bundle
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
